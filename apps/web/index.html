<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Voice rooms you can walk around in. The closer you stand, the clearer you hear." />
    <meta name="theme-color" content="#0c1226" />
    <title>Talk Space</title>

    <!--
      Link preview (WhatsApp, iMessage, Telegram, Slack, Discord, X, Facebook, LinkedIn...).
      Crawlers don't run JavaScript, so this has to be in the static HTML. It is the same for every page,
      room invite links included, and says nothing about any particular room.
      The site address in the image URLs is filled in at build time (VITE_SITE_URL, see vite.config.ts);
      the picture is public/og-image.jpg, drawn by `pnpm --filter web og`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Talk Space" />
    <meta property="og:title" content="Talk Space: walk over to a conversation" />
    <meta property="og:description" content="Voice rooms you can walk around in. The closer you stand, the clearer you hear." />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:secure_url" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pixel-art people on a beach pier, each tagged with how clearly you hear them: 100% nearby, 47% and 16% farther away." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Talk Space: walk over to a conversation" />
    <meta name="twitter:description" content="Voice rooms you can walk around in. The closer you stand, the clearer you hear." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Pixel-art people on a beach pier, each tagged with how clearly you hear them: 100% nearby, 47% and 16% farther away." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
