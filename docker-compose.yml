services:
  postgres:
    image: postgres:17-alpine
    container_name: app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: app-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-redis}",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO's official Docker Hub / quay.io images were removed in Sept 2026,
  # so this uses Chainguard's build of MinIO instead.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: app-minio
    restart: unless-stopped
    user: "0:0" # image defaults to uid 65532; root avoids volume permission errors in local dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000" # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web console
    volumes:
      - minio_data:/data

  # Creates the bucket, retrying until MinIO is up (no shell/healthcheck needed)
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: app-minio-init
    depends_on:
      - minio
    restart: on-failure
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000
    command: ["mb", "--ignore-existing", "local/${MINIO_BUCKET:-app-bucket}"]

  # TURN relay (coturn): the fix for "stuck on Connecting…" between people on strict NATs
  # (symmetric / carrier-grade NAT: many mobile networks and ISPs), where STUN alone cannot work.
  #
  #   export TURN_SECRET=$(openssl rand -hex 32); echo "$TURN_SECRET"   # keep it: the API needs the same value
  #   export TURN_EXTERNAL_IP=<this machine's public IP>               # required behind cloud 1:1 NAT (AWS/GCP/Oracle...)
  #   docker compose --profile turn up -d coturn
  #
  # Run it on a machine with a PUBLIC IP, not behind your home router. Open on its firewall:
  #   3478 (udp + tcp), and 49152-50151 (udp). Every relayed link uses one relay port per side, and a
  #   full-mesh room of 8 relayed people needs ~56, so do not shrink the range casually.
  # Host networking is deliberate: relaying needs that wide UDP range, which Docker port-mapping handles badly.
  # It refuses to start without TURN_SECRET (an empty secret would be an open relay).
  # Relaying to private/internal addresses is denied (SSRF into your own network); because of that, TURN cannot be
  # tested between two machines on the same LAN as the relay: use real, separate networks.
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:latest # pin a current tag in production: older coturn releases had relay-filter CVEs
    container_name: app-coturn
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_REALM: ${TURN_REALM:-talkspace}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$$TURN_SECRET" ] || { echo "TURN_SECRET is empty: refusing to start an open relay" >&2; exit 1; }
        exec turnserver -n --log-file=stdout --fingerprint --no-cli \
          --realm="$$TURN_REALM" \
          --use-auth-secret --static-auth-secret="$$TURN_SECRET" \
          --listening-port=3478 --min-port=49152 --max-port=50151 \
          --user-quota=20 --total-quota=2000 \
          --no-multicast-peers \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.0.0.0-192.0.0.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --denied-peer-ip=198.18.0.0-198.19.255.255 \
          --denied-peer-ip=240.0.0.0-255.255.255.255 \
          --denied-peer-ip=::1 \
          --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255 \
          $${TURN_EXTERNAL_IP:+--external-ip=$$TURN_EXTERNAL_IP}

volumes:
  postgres_data:
  redis_data:
  minio_data:
